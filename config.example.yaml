# webshell-guard 示例配置
# 监控的网站根目录（必填，支持多个）
watch_dirs:
  - "D:/wwwroot/colorpantone"

# 监控的脚本扩展名
extensions: [".aspx", ".ashx", ".ascx", ".php", ".jsp", ".jspx"]

# 周期全量兜底扫描
scan_interval: 10m

# 写入事件防抖：等文件写完再检测
debounce: 500ms

# 超过该大小的文件跳过实时检测（字节）
max_file_size: 5242880

# 判恶分值线
score_threshold: 6

# 处置模式: quarantine(隔离,推荐) | delete(直接删除) | alert(仅告警)
action: quarantine

# 隔离目录
quarantine_dir: "./quarantine"

# webhook 告警
webhook:
  url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx"
  type: feishu        # generic | dingtalk | feishu | wecom
  timeout: 10
  retry: 3

# 基线对比
baseline:
  enabled: true
  file: "./baseline.json"

# 忽略的目录段（不进入监控/扫描）
ignore_dirs: ["App_Data", "bin", "obj", ".git", "node_modules"]

# 挂马判断时放行的外链域（CDN 等）
external_domain_whitelist:
  - "cdn.bootcss.com"
  - "cdn.staticfile.org"
  - "at.alicdn.com"

# 确认干净的文件 SHA256 白名单（不再告警）
whitelist_hashes: []

# 自定义规则追加：正则 -> 权重
extra_rules:
  "evilhack_.*": 10

# 同一文件告警冷却时间
alert_cooldown: 60s

# 共享规则库同步（多机部署时统一特征库）
# git 模式把规则 yaml 放进仓库的 rules/ 目录（可再分子目录，拉取时递归遍历），
# 旧版直接放仓库根目录的布局仍兼容；raw 模式由 files 列出要拉取的文件；
# 拉取失败自动用上次缓存(rules_synced.yaml)继续防护。
# 规则格式（数组或单条对象，未写 enabled 默认启用）：
#   - id: "PHP-XXX"        # 全网唯一，与本地规则同ID时本地优先
#     kind: webshell       # webshell | horse
#     score: 8
#     desc: "描述"
#     pattern: "正则"      # 或用 patterns: [多个正则全部命中才计分]
#
# mode=raw 时节点无需安装 git，直接 HTTP 拉取 Git 服务器的 raw 地址：
#   repo 填 raw 目录前缀 + files 列出文件名，例如
#     repo:  "https://git.example.com/team/webshell-rules/raw/branch/main"
#     files: ["shared-rules.yaml", "php-family.yaml"]
#   或 repo 直接填单个文件 URL（files 留空）。
# 各服务器 raw 地址格式：
#   Gitea/Gogs: https://host/team/repo/raw/branch/main
#   GitLab:     https://host/team/repo/-/raw/main
#   GitHub:     https://raw.githubusercontent.com/user/repo/main
rules_sync:
  enabled: false
  mode: raw              # git(需节点装git) | raw(纯HTTP,推荐)
  repo: ""               # raw: 文件URL或raw目录前缀；git: 仓库地址(私有仓库用带凭据的URL)
  branch: main           # git 模式分支
  interval: 300          # 拉取周期(秒)
  token: ""              # raw 模式认证 token(私库需要)
  auth_header: ""        # raw 模式认证头, 默认 "Authorization: Bearer {token}"；Gitea 私库可用 "Authorization: token {token}"
  files: []              # raw 模式: repo 为目录前缀时的文件名列表；repo 为单个文件 URL 时留空

# 日志文件
log_file: "./webshell-guard.log"
