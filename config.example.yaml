# webshell-guard 示例配置
# 监控的网站根目录（必填，支持多个）
watch_dirs:
  - "D:/wwwroot/colorpantone"

# 监控的脚本扩展名
extensions: [".aspx", ".ashx", ".ascx", ".php", ".jsp", ".jspx"]

# 周期全量兜底扫描
scan_interval: 10m

# 写入事件防抖：等文件写完再检测
debounce: 500ms

# 超过该大小的文件跳过实时检测（字节）
max_file_size: 5242880

# 判恶分值线
score_threshold: 6

# 处置模式: quarantine(隔离,推荐) | delete(直接删除) | alert(仅告警)
action: quarantine

# 隔离目录
quarantine_dir: "./quarantine"

# webhook 告警
webhook:
  url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx"
  type: feishu        # generic | dingtalk | feishu | wecom
  timeout: 10
  retry: 3

# 基线对比
baseline:
  enabled: true
  file: "./baseline.json"

# 忽略的目录段（不进入监控/扫描）
ignore_dirs: ["App_Data", "bin", "obj", ".git", "node_modules"]

# 挂马判断时放行的外链域（CDN 等）
external_domain_whitelist:
  - "cdn.bootcss.com"
  - "cdn.staticfile.org"
  - "at.alicdn.com"

# 确认干净的文件 SHA256 白名单（不再告警）
whitelist_hashes: []

# AI 复核：命中风险字符的文件先送 AI 判定，避免正常业务代码被误隔离。
# AI 固定回答 SAFE / MALICIOUS；判 SAFE 的文件按 SHA256 永久加白（文件一改哈希就变，会重新检测）。
# 隔离区点「恢复」也会按内容哈希自动加白（来源 manual-restore）。
ai_judge:
  enabled: false
  type: chat               # chat(自建 chat.ashx，MD5 签名，默认) | openai(OpenAI 兼容接口)
  # ── type: chat ── 自建接口（NCShop.Web/API/open/chat.ashx）
  url: "http://192.168.0.132:8787/api/open/chat.ashx"
  app_key: "your_app_key"  # 自建接口的 APPKEY（勿公开提交）；key = md5(时间戳 + app_key)；同时以 sign/key 两个参数名发送
  date_unit: ms            # date 参数形式：ms(毫秒) | s(秒) | datetime(yyyyMMddHHmmss)
  key_order: date_first    # date_first(时间戳+APPKEY) | appkey_first(APPKEY+时间戳)
  key_upper: false         # MD5 是否转大写
  # ── type: openai ── 标准 OpenAI 兼容接口（app_key 作为 Bearer key，必须配 model）
  # url: "https://api.openai.com/v1/chat/completions"   # 或中转站/本地大模型地址
  # app_key: "sk-xxxxxxxx"
  # model: "gpt-4o-mini"    # deepseek-chat / qwen-plus / 本地模型名等
  timeout: 20              # 单次请求超时(秒)
  whitelist_file: "./ai_whitelist.json"
  # 风险字符（正则，忽略大小写）；留空则用内置默认：
  # ProcessStartInfo / Process / .WriteAllText / .WriteAllBytes / FromBase64String /
  # GetEnvironmentVariable / comspec / powershell / cmd.exe
  keywords: []

# 自定义规则追加：正则 -> 权重
extra_rules:
  "evilhack_.*": 10

# 同一文件告警冷却时间
alert_cooldown: 60s

# 共享规则库同步（多机部署时统一特征库）
# git 模式把规则 yaml 放进仓库的 rules/ 目录（可再分子目录，拉取时递归遍历），
# 旧版直接放仓库根目录的布局仍兼容；raw 模式由 files 列出要拉取的文件；
# 拉取失败自动用上次缓存(rules_synced.yaml)继续防护。
# 规则格式（数组或单条对象，未写 enabled 默认启用）：
#   - id: "PHP-XXX"        # 全网唯一，与本地规则同ID时本地优先
#     kind: webshell       # webshell | horse
#     score: 8
#     desc: "描述"
#     pattern: "正则"      # 或用 patterns: [多个正则全部命中才计分]
#                          # 或用 keywords: ["关键字1","关键字2"] 全部出现才计分
#
# mode=raw 时节点无需安装 git，直接 HTTP 拉取 Git 服务器的 raw 地址：
#   repo 填 raw 目录前缀 + files 列出文件名，例如
#     repo:  "https://git.example.com/team/webshell-rules/raw/branch/main"
#     files: ["shared-rules.yaml", "php-family.yaml"]
#   或 repo 直接填单个文件 URL（files 留空）。
# 各服务器 raw 地址格式：
#   Gitea/Gogs: https://host/team/repo/raw/branch/main
#   GitLab:     https://host/team/repo/-/raw/main
#   GitHub:     https://raw.githubusercontent.com/user/repo/main
rules_sync:
  enabled: false
  mode: raw              # git(需节点装git) | raw(纯HTTP,推荐)
  repo: ""               # raw: 文件URL或raw目录前缀；git: 仓库地址(私有仓库用带凭据的URL)
  branch: main           # git 模式分支
  interval: 300          # 拉取周期(秒)
  token: ""              # raw 模式认证 token(私库需要)
  auth_header: ""        # raw 模式认证头, 默认 "Authorization: Bearer {token}"；Gitea 私库可用 "Authorization: token {token}"
  files: []              # raw 模式: repo 为目录前缀时的文件名列表；repo 为单个文件 URL 时留空

# Web 面板访问口令（可选；留空则每次启动随机生成并打印到日志）
# 浏览器打开面板时弹出登录框：用户名任意，密码填此值；也可 API 用 Basic Auth。
ui:
  enabled: true
  port: 9090
  token: ""

# 程序自升级：定时拉取升级清单(JSON)，发现新版本可自动下载替换 exe 并重启生效。
# 清单格式: {"version":"v1.0.1","url":"https://host/webshell-guard.exe","sha256":"<64位哈希>","notes":"说明"}
# sha256 建议填写：替换前会校验下载内容，不符则丢弃（防篡改/下载不完整）。
# 替换原理：运行中的 exe 重命名为 .old 备份 → 新版落盘原路径 → 进程退出由 SCM/新进程拉起。
# 手动升级也可在服务器执行: webshell-guard.exe -update -c config.yaml
# 发布新版本: 在开发机执行 release\release.bat vX.Y.Z，把产物上传到 GitCode Releases（标签 latest，覆盖上传，见 release.bat 提示）。
update:
  enabled: false
  auto_apply: false      # true: 发现新版本自动升级重启; false: 仅面板/托盘提示, 由人工确认升级
  url: "https://gitcode.com/Kealy/webshell-guard-go/releases/download/latest/manifest.json"
  interval: 3600         # 检查周期(秒)
  token: ""
  auth_header: ""        # 认证头, 默认 "Authorization: Bearer {token}"

# 日志文件
log_file: "./webshell-guard.log"
